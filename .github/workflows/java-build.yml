name: java-build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile, test, and verify invariants
        run: bash scripts/verify_final.sh
      - name: Trunk Check
        uses: trunk-io/trunk-action@v1
